name: Android

on:
  pull_request:
  push:
    branches:
      - main
      - android-auto-official-video
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test, lint, verify APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Varsayılan: yalnızca main önbelleğe yazar. main'de bu iş akışı
          # hiç çalışmadığından her iş sıfırdan indiriyordu (Foojay eklenti
          # hatası). Bu geliştirme dalı da önbelleğe yazabilsin.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/android-auto-official-video' }}

      - name: Download dependencies
        run: scripts/gradle-retry.sh --no-daemon :app:dependencies --configuration projectionReleaseRuntimeClasspath --quiet

      # Release imzası: yalnızca GitHub Actions Secrets.
      #   KARADAG_RELEASE_KEYSTORE_BASE64   (keystore dosyasının base64 hâli)
      #   KARADAG_RELEASE_KEYSTORE_PASSWORD
      #   KARADAG_RELEASE_KEY_ALIAS
      #   KARADAG_RELEASE_KEY_PASSWORD
      # Biri eksikse release APK'ları imzasız üretilir ve bu adım uyarır.
      - name: Release signing setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KARADAG_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KARADAG_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KARADAG_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KARADAG_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KARADAG_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "KARADAG_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KARADAG_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "KARADAG_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release imzası: secrets bulundu, release APK'ları imzalanacak."
          else
            echo "::warning title=Release imzası yok::KARADAG_RELEASE_* secrets tanımlı değil. Release APK'ları İMZASIZ üretilecek (Play'e yüklenemez)."
          fi

      - name: Unit tests (play + projection)
        run: scripts/gradle-retry.sh --no-daemon testPlayDebugUnitTest testProjectionDebugUnitTest

      - name: Lint / static analysis (play + projection)
        run: scripts/gradle-retry.sh --no-daemon lintPlayDebug lintProjectionDebug

      - name: Assemble all APKs and release bundles (AAB, Play requires AAB)
        run: scripts/gradle-retry.sh --no-daemon assemblePlayDebug assemblePlayRelease assembleProjectionDebug assembleProjectionRelease bundlePlayRelease bundleProjectionRelease

      - name: Verify APKs (packages, versionCode, conflicts, signing)
        run: scripts/verify-apks.sh

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-bundles
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  device-tests:
    # Android Emulator (Android Auto host / araç YOK). Gerçek ExoPlayer +
    # SurfaceView, PackageManager keşif sorguları, yan yana kurulum.
    name: Emulator tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Varsayılan: yalnızca main önbelleğe yazar. main'de bu iş akışı
          # hiç çalışmadığından her iş sıfırdan indiriyordu (Foojay eklenti
          # hatası). Bu geliştirme dalı da önbelleğe yazabilsin.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/android-auto-official-video' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug and test APKs
        run: scripts/gradle-retry.sh --no-daemon assemblePlayDebug assembleProjectionDebug assemblePlayDebugAndroidTest assembleProjectionDebugAndroidTest

      - name: Instrumented tests + device checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            scripts/gradle-retry.sh --no-daemon connectedPlayDebugAndroidTest connectedProjectionDebugAndroidTest
            scripts/device-checks.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
