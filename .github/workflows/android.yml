name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (play + sideloadLegacy)
        run: ./gradlew --no-daemon testPlayDebugUnitTest testSideloadLegacyDebugUnitTest

      - name: Lint (play)
        run: ./gradlew --no-daemon lintPlayDebug

      - name: Assemble
        run: ./gradlew --no-daemon assemblePlayDebug assemblePlayRelease assembleSideloadLegacyDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
