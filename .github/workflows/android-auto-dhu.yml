name: Android Auto DHU probe

# Gerçek Android Auto (emülatördeki gearhead) + Desktop Head Unit.
# Gerçek araç DEĞİLDİR. Ana CI'dan ayrıdır; sonuçlar artifact'a yazılır.
on:
  push:
    branches:
      - android-auto-official-video
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dhu:
    name: DHU probe (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/android-auto-official-video' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install DHU and libc++
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libc++1 libc++abi1 faketime
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "extras;google;auto" > /dev/null
          ls -la "$ANDROID_HOME/extras/google/auto/"
      - name: Build projection debug APK
        run: scripts/gradle-retry.sh --no-daemon assembleProjectionDebug
      - name: DHU probe on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: DHU_OUT=dhu-out-api${{ matrix.api-level }} scripts/dhu-probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dhu-probe-api${{ matrix.api-level }}
          path: dhu-out-api${{ matrix.api-level }}/
          if-no-files-found: warn

  aa-versions:
    # Emülatör imajlarındaki Android Auto sürümleri: host kodu yükleme
    # (CarVideoServiceHostDeviceTest) + yerinde dex analizi.
    name: AA host load (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 31, 32, 33, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/android-auto-official-video' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: scripts/gradle-retry.sh --no-daemon assembleProjectionDebug assembleProjectionDebugAndroidTest
      - name: Host load test + gearhead analysis
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            scripts/gradle-retry.sh --no-daemon connectedProjectionDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.karadaglabs.cartv.CarVideoServiceHostDeviceTest || echo "HOST TEST FAILED"
            scripts/analyze-gearhead.sh | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aa-host-api${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore
