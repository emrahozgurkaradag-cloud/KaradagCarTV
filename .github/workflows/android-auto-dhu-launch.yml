name: Android Auto DHU launch

# Android Auto'nun (emülatördeki gerçek, Google imzalı gearhead) Desktop Head
# Unit oturumunda KaradagCarTV'yi KENDİSİNİN açıp açmadığını, CarVideoActivity
# yüzeyinin araç akışına video verip vermediğini ve park kilidini sınar.
# Gerçek araç DEĞİLDİR. Kanıtlar artifact'a yazılır (dhu-launch-api*).
on:
  push:
    branches:
      - android-auto-official-video
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhu-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    name: DHU launch (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Emülatör imajlarındaki gearhead (taslak / 5.3-preinstall) AOSP test
        # anahtarıyla imzalı. Yazılabilir sistem imajında kaldırılır, yerine
        # Google imzalı güncel Android Auto kurulur (imza denetimiyle).
        # API 34: ARM çevirisi var (AA 18 yalnızca arm64 yerel kitaplık taşıyor).
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/android-auto-official-video' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install DHU, OCR, ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libc++1 libc++abi1 faketime tesseract-ocr ffmpeg imagemagick
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "extras;google;auto" > /dev/null
      - name: Current Android Auto (Google-signed; signature checked on device)
        run: |
          mkdir -p aa
          curl -fsSL -o apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu && chmod +x apkeep
          # APKPure yalnızca araştırma kaynağıdır: indirilen paket cihazda önceden
          # kurulu Google gearhead imzasıyla karşılaştırılır; eşleşmezse KURULMAZ.
          ./apkeep -l -a com.google.android.projection.gearhead -d apk-pure < /dev/null | head -5 || true
          ./apkeep -d apk-pure -o 'acknowledge_dangers=true,arch=x86_64;arm64-v8a' -a com.google.android.projection.gearhead aa/ < /dev/null || true
          if ! ls aa/* >/dev/null 2>&1; then
            curl -fsSL -A "Mozilla/5.0" -o aa/gearhead.xapk "https://d.apkpure.com/b/XAPK/com.google.android.projection.gearhead?version=latest" || true
          fi
          ls -la aa/
      - name: Test stream (generated, served on 10.0.2.2:8088)
        run: |
          mkdir -p stream
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440:sample_rate=44100 \
            -t 900 -c:v libx264 -preset ultrafast -tune zerolatency -g 50 -pix_fmt yuv420p -c:a aac -b:a 96k -f mpegts stream/test.ts
          ls -la stream/
          nohup python3 -m http.server 8088 --directory stream > http.log 2>&1 &
          sleep 2; curl -sI http://127.0.0.1:8088/test.ts | head -3
      - name: Build projection debug APK
        run: scripts/gradle-retry.sh --no-daemon assembleProjectionDebug
      - name: DHU launch session
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -writable-system
          script: AA_DIR=aa DHU_OUT=dhu-launch-api${{ matrix.api-level }} STREAM_URL=http://10.0.2.2:8088/test.ts scripts/dhu-launch.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dhu-launch-api${{ matrix.api-level }}
          path: |
            dhu-launch-api${{ matrix.api-level }}/
            !dhu-launch-api${{ matrix.api-level }}/aa/
            !dhu-launch-api${{ matrix.api-level }}/*.apk
          if-no-files-found: warn
